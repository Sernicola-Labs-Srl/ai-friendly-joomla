PKG_AIFRIENDLY="AI Friendly"
PKG_AIFRIENDLY_DESCRIPTION="Serves llms.txt, Markdown endpoints and Semantic Schema (JSON-LD) so AI clients can read your Joomla content. Installs a shared library, the AI Content Hub and three plugins."
