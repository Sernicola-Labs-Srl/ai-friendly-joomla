PKG_AIFRIENDLY="AI Friendly"
PKG_AIFRIENDLY_DESCRIPTION="Pubblica llms.txt, endpoint Markdown e Semantic Schema (JSON-LD) perché i client AI leggano i contenuti del sito Joomla. Installa una libreria condivisa, l'AI Content Hub e tre plugin."
PKG_AIFRIENDLY_FORSEO_NOTICE="4SEO è stato rilevato. AI Friendly può aggiungere alcune righe al file delle funzioni di 4SEO, così i suoi dati strutturati includono l'identità del sito. Non è stato cambiato nulla: se vuoi, attivalo da Componenti > AI Friendly > Schema. Le righe vengono tolte se disinstalli AI Friendly."
